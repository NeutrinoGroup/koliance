name: Render Background Keepalive

on:
  schedule:
    # Runs every 10 minutes between 02:00 UTC and 13:59 UTC (10:00 to 21:59 Beijing Time / UTC+8).
    # Keeps instance awake for ~12 hours/day (consuming ~372 hours/month out of Render's 750 free hours).
    # Outside this window (22:00 to 09:59 Beijing Time), the instance sleeps, preserving ~50% free quota.
    - cron: '*/10 2-13 * * *'
  workflow_dispatch:

jobs:
  ping-healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render Backend Health Probe
        run: |
          CURRENT_HOUR_UTC=$(date -u +"%H")
          CURRENT_HOUR_BJ=$(( (10#$CURRENT_HOUR_UTC + 8) % 24 ))
          echo "[INFO] Keepalive trigger time: UTC ${CURRENT_HOUR_UTC}:00 / Beijing Time ${CURRENT_HOUR_BJ}:00 (Scheduled window: 10:00 - 21:59 Beijing Time)"
          BACKEND_URL="${{ secrets.BACKEND_API_URL || 'https://koliance-backend.onrender.com' }}"
          echo "[INFO] Sending keepalive probe to ${BACKEND_URL}/healthz..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/healthz" || echo "000")
          echo "[INFO] Healthz probe response status: ${HTTP_STATUS}"
          
          echo "[INFO] Sending keepalive probe to ${BACKEND_URL}/api/v1/market/movers..."
          MOVERS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/api/v1/market/movers" || echo "000")
          echo "[INFO] Market movers probe response status: ${MOVERS_STATUS}"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "[OK] Render backend instance is warm and healthy."
          else
            echo "[WARN] Render backend healthz ping responded with status: ${HTTP_STATUS}"
          fi
