[package]
name = "koliance-solver"
version = "0.1.0"
edition = "2021"
authors = ["Koliance Core Devs <developer@koliance.io>"]
description = "Ultra-low latency liquidation parity solver & EIP-712 session key validator for Monad Perp"
license = "MIT"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
ethnum = { version = "1.5.3", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"
