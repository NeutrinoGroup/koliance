services:
  - type: web
    name: koliance-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o api cmd/api/main.go
    startCommand: ./api
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: STEAM_API_KEY
        sync: false
      - key: STEAM_DOMAIN
        value: koliance.oodai.space
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets/v2
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: MONAD_CHAIN_ID
        value: "10143"
      - key: KOLIANCE_CONTRACT_ADDRESS
        value: "0x32fDd6B096EE14246b5b6971135286Bad01F4928"
      # Browser origins allowed by CORS (exact match, comma separated; no "*").
      - key: CORS_ALLOWED_ORIGINS
        value: "https://koliance.oodai.space,http://localhost:3000,http://127.0.0.1:3000"
      # Operator bearer token for batch-settle / Stripe customer / Alpaca writes.
      # Set it in the Render dashboard; unset = those endpoints answer 503.
      - key: KOLIANCE_API_TOKEN
        sync: false
      # Hackathon demo: let browsers place Alpaca *paper* trades without the
      # operator token (inputs are still validated and capped). Set to "false"
      # to make trade/close operator-only.
      - key: DEMO_PUBLIC_TRADING
        value: "true"
